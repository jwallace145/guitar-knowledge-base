name: CI

# Does not run on `edited`: a title change must not start a newer CI run.
# GitHub evaluates required checks against the newest run of each workflow,
# and the `plan` job cannot run on `edited`, so a title edit used to leave the
# required `plan / jwall-engineering-sites plan` check "Expected" forever.
# The PR title is linted by pr-title.yml, which does run on `edited`.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    # Dependabot writes multi-line commit bodies that cannot be changed. Its PRs are
    # squash-merged, so the PR title lint in pr-title.yml still governs what lands on main.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in the PR range
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run zensical build --strict --clean

  plan:
    name: plan
    # The sites CLI validates jwall-engineering-sites.yaml and plans the
    # infrastructure as the plan role; the plan is a sticky PR comment.
    # Fork PRs get no OIDC token, so only branches of this repository plan.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-plan.yml@v0.10.1
    with:
      plan-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the plan role, through OIDC
      pull-requests: write # the sticky plan comment
