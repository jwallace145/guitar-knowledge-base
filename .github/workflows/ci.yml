name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    # Dependabot writes multi-line commit bodies that cannot be changed. Its PRs are
    # squash-merged, so the PR title lint below still governs what lands on main.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in the PR range
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  pr-title-lint:
    name: PR title lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint the PR title as a commit header
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run zensical build --strict --clean

  plan:
    name: plan
    # The sites CLI validates jwall-engineering-sites.yaml and plans the
    # infrastructure as the plan role; the plan is a sticky PR comment.
    if: >-
      github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-plan.yml@v0.7.0
    with:
      plan-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the plan role, through OIDC
      pull-requests: write # the sticky plan comment
