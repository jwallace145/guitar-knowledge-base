name: Preview

# Every pull request from this repository gets a preview at
# https://pr-<n>.preview.guitar.jwall.engineering/. The build is this repo's;
# publishing and cleanup are the jwall-engineering-sites reusable workflow,
# which runs as the preview role and writes previews/pr-<n>/ in the site bucket.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run zensical build --strict --clean
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  preview:
    name: preview
    needs: build
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-preview.yml@v0.7.0
    with:
      artifact: site
      preview-role-arn: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the preview role, through OIDC
      pull-requests: write # the sticky preview comment
