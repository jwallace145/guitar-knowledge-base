name: Release

# Merges to main accumulate in a Release Please PR. Merging that PR is the
# deliberate, human-reviewed act that releases a tag and deploys the site:
# the deploy job applies infra/ and publishes the tag's build to S3 +
# CloudFront. Nothing reaches production without that merge.
#
# workflow_dispatch redeploys an existing release (latest by default) without
# touching Release Please.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (defaults to the latest GitHub Release)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  SITE_URL: https://guitar.jwall.engineering/

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token makes jwallace145-release-bot[bot] the author of release PRs
      # and lets CI run on them. PRs opened with GITHUB_TOKEN do not trigger workflows.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: deploy
    needs: release-please
    # Runs when this push created a release, or on manual dispatch. The
    # release is created with the app token, so a separate `release`-triggered
    # workflow would not reliably fire; the deploy lives here instead.
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' &&
         needs.release-please.result == 'success' &&
         needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # The apply role trusts the `environment:prod` OIDC subject.
    environment:
      name: prod
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
      id-token: write # OIDC token for the apply role
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not determine a release tag to deploy"
            exit 1
          fi
          echo "Deploying $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ steps.tag.outputs.tag }}

      # --- Infrastructure -------------------------------------------------
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend-config=backend/prod.hcl
        working-directory: infra
      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=120s -out=tfplan
        working-directory: infra
      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=120s tfplan
        working-directory: infra
      - name: Read stack outputs
        id: stack
        run: |
          echo "bucket=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw prod_distribution_id)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      # --- Site -----------------------------------------------------------
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run zensical build --strict --clean

      - name: Sync to S3
        env:
          S3_BUCKET: ${{ steps.stack.outputs.bucket }}
        run: .github/scripts/sync-site.sh site "s3://$S3_BUCKET/prod/" 3600

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## Deployed $TAG"
            echo
            echo "- Site: $SITE_URL"
            echo "- Terraform applied, bucket synced, CloudFront invalidation created."
          } >> "$GITHUB_STEP_SUMMARY"
