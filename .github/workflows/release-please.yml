name: Release

# Merges to main accumulate in a Release Please PR; merging it creates a tag
# and deploys it. `workflow_dispatch` re-deploys a tag (defaults to the latest
# release). The build is this repo's; applying the infrastructure, publishing
# prod/ and invalidating CloudFront are the jwall-engineering-sites reusable
# workflow, which runs as the apply role in the prod environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (defaults to the latest GitHub Release)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-release-please.yml@v0.8.0
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  tag:
    name: resolve tag
    needs: release-please
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' &&
         needs.release-please.result == 'success' &&
         needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not determine a release tag to deploy"
            exit 1
          fi
          echo "Deploying $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run zensical build --strict --clean
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 1

  deploy:
    name: deploy
    needs: [tag, build]
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-deploy.yml@v0.8.0
    with:
      artifact: site
      tag: ${{ needs.tag.outputs.tag }}
      apply-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
      site-url: https://guitar.jwall.engineering/
    permissions:
      contents: read
      id-token: write # the apply role, through OIDC
