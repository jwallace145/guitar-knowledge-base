[project]
site_name = "Guitar Knowledge Base"
site_url = "https://guitar.jwall.engineering/"
site_description = "Guitar theory and study notes: intervals, scales, harmony, the fretboard, technique, and repertoire."
site_author = "Jimmy Wallace"
copyright = "Copyright &copy; 2026 Jimmy Wallace"

repo_url = "https://github.com/jwallace145/guitar-knowledge-base"
repo_name = "jwallace145/guitar-knowledge-base"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Theory" = [
    { "Overview" = "theory/index.md" },
    { "The major scale" = "theory/major-scale.md" },
  ] },
  { "Fretboard" = [
    { "Overview" = "fretboard/index.md" },
  ] },
  { "Techniques" = [
    { "Overview" = "techniques/index.md" },
  ] },
  { "Repertoire" = [
    { "Overview" = "repertoire/index.md" },
  ] },
  { "About" = "about.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/guitar"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jwallace145/guitar-knowledge-base"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
